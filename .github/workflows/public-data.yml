# Scheduled public snapshots stay separate from browser-local records.
# Missing credentials skip market fetches; identity reconciliation still removes obsolete quotes.
name: Update public data

on:
  schedule:
    # A bit after Tibia's 10:00 server-save (08:00 UTC in CEST, 09:00 UTC in CET) so a fresh day's
    # highscores are almost always available; a second run smooths over the scheduler drift GitHub
    # Actions' cron is known to have.
    - cron: '30 8,20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: public-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Update public data snapshots
        env:
          TIBIA_MARKET_TOKEN: ${{ secrets.TIBIA_MARKET_TOKEN }}
        run: node scripts/update-public-data.mjs

      - name: Run the test suite against the updated snapshots
        run: npm test

      - name: Commit updated snapshots
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/public-history.json src/data/market-watch.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: public data snapshot for $(date -u +%F)"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Redeploy GitHub Pages with the updated snapshots
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # A GITHUB_TOKEN push does not trigger other push-triggered workflows, so deploy-pages.yml
        # would not otherwise pick up this commit; dispatching it directly does not modify that
        # workflow file.
        run: gh workflow run deploy-pages.yml --ref main
